<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview — Lines &amp; Logos Business OS</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/os.css?v=9">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lines & Logos">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body data-perms="notifications">
<main>
  <div class="topbar">
    <div><div class="crumb">Business OS / Overview</div><h1 class="chrome">Overview</h1></div>
    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm" onclick="runDaily()">▶ Daily Ops Brief</button>
      <button class="btn btn-sm" onclick="newLead()">+ New Lead</button>
    </div>
  </div>
  <div class="tabs2" id="tabs"></div>
  <div id="view"></div>
</main>
<script defer src="assets/os.js?v=10"></script>
<script>
/* os.js is deferred — destructuring OS and booting must wait for
   DOMContentLoaded (fires after deferred scripts). Functions stay global so
   inline onclick handlers can reach them; they only run post-boot anyway. */
let view='overview';
let fmt,ago,esc,TIER,INV,GEN;
function boot(){ ({fmt,ago,esc,TIER,INV,GEN}=OS); renderTabs(); render(); }
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>OS.boot('overview','Overview',boot));
else OS.boot('overview','Overview',boot);
const TABS=[['overview','Overview'],['reports','Reports']];
function renderTabs(){OS.$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${view===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('');}
function go(v){view=v;renderTabs();render();}

async function render(){
  const [stats,leads,jobs,invoices,activity,accounts]=await Promise.all(
    [OS.get('stats',true).catch(()=>null),OS.list('leads'),OS.list('jobs'),OS.list('invoices'),OS.list('activity'),OS.list('accounts')]);
  const s=stats||computeStats();
  if(view==='overview') vOverview(s,leads,jobs,invoices,activity);
  else vReports(s,accounts,jobs,invoices);
}
function computeStats(){
  const jobs=OS.cur('jobs'),inv=OS.cur('invoices');
  return {pipeline:jobs.filter(j=>j.status!=='complete').reduce((s,j)=>s+j.value,0),
    outstanding:inv.filter(i=>i.status!=='paid').reduce((s,i)=>s+i.amount,0),
    overdueCount:inv.filter(i=>i.status==='overdue').length,
    hotLeads:OS.cur('leads').filter(l=>l.tier==='hot').length,
    activeJobs:jobs.filter(j=>j.status==='in-progress').length,
    collected:inv.filter(i=>i.status==='paid').reduce((s,i)=>s+i.amount,0),
    expensesTotal:OS.cur('expenses').reduce((s,x)=>s+x.amount,0),
    openQuotes:OS.cur('quotes').filter(q=>q.status==='sent').length,
    pendingApprovals:OS.cur('approvals').filter(a=>a.status==='pending').length,
    openTickets:OS.cur('tickets').filter(t=>t.status!=='resolved').length,
    crew:OS.cur('employees').length,accounts:OS.cur('accounts').length};
}
async function goliveDismiss(){localStorage.setItem('ll_golive_dismissed',String(Date.now()));render();}
async function goliveSaveKeys(){const pk=OS.$('#gl-pk').value.trim(),sk=OS.$('#gl-sk').value.trim();
  if(!pk||!sk)return OS.toast('Paste both keys');
  const r=await fetch('/api/golive/stripe-keys',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+OS.TOKEN},body:JSON.stringify({publishable:pk,secret:sk})}).then(r=>r.json()).catch(()=>null);
  if(!r)return OS.toast('Request failed');
  if(r.error)return OS.toast(r.error,6000);
  OS.toast('Stripe keys saved ('+r.mode+' mode) — '+r.secretMasked);render();}
async function goliveSaveWebhook(){const wh=OS.$('#gl-wh').value.trim();
  if(!wh)return OS.toast('Paste the whsec_ signing secret');
  const r=await fetch('/api/golive/webhook-secret',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+OS.TOKEN},body:JSON.stringify({secret:wh})}).then(r=>r.json()).catch(()=>null);
  if(!r)return OS.toast('Request failed');
  if(r.error)return OS.toast(r.error,6000);
  OS.toast('Webhook secret saved ('+r.webhookMasked+')');render();}
async function goliveTaxRecheck(){OS.toast('Checking Stripe Tax…');window._glRefresh=1;render();}
async function aiSetupRun(){const r=await OS.aiApi('setup',{method:'POST',body:'{}'}).catch(()=>null);
  if(r&&r.opencodeKey){try{await navigator.clipboard.writeText(r.opencodeKey);}catch(e){}OS.toast('OpenCode key generated & copied (shown once)',8000);}
  else if(r){OS.toast('AI setup completed');}
  else{OS.toast('Setup failed — try Admin → Settings');return;}
  localStorage.setItem('ll_ai_setup_dismissed','1');render();}
async function vOverview(s,leads,jobs,invoices,activity){
  const gl = await OS.get('golive').catch(()=>null);
  const aiS = (['owner','admin'].includes(OS.USER.role) && !localStorage.getItem('ll_ai_setup_dismissed')) ? await OS.aiApi('setup').catch(()=>null) : null;
  let glS=null, glDismissedAt=+(localStorage.getItem('ll_golive_dismissed')||0);
  if(['owner','admin'].includes(OS.USER.role)&&OS.isLive()&&(!glDismissedAt||Date.now()-glDismissedAt>7*864e5)){
    glS=await fetch('/api/golive/status'+(window._glRefresh?'?refresh=1':''),{headers:{Authorization:'Bearer '+OS.TOKEN}}).then(r=>r.json()).catch(()=>null);
    window._glRefresh=0;
  }
  const goliveCard=(glS&&!glS.allDone)?`
  <div class="panel" style="--accent:var(--lime);margin-bottom:16px;background:radial-gradient(120% 140% at 15% 0%,rgba(67,209,124,.14),transparent 60%),var(--panel)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><h3 style="margin:0 0 4px">🚀 Go-live checklist — start taking real payments</h3>
      <div style="font-size:12.5px;color:var(--mut)">Three steps between this deploy and live payments. You can finish them right here.</div></div>
      <button class="btn sm ghost" onclick="goliveDismiss()" title="Remind me in 7 days">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px">
      <div style="border:1px solid var(--line);border-radius:12px;padding:14px">
        <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${glS.liveKeys?'var(--green)':'var(--orange)'};margin-bottom:6px">${glS.liveKeys?'✓':'1.'} Live Stripe keys ${glS.liveKeys?'('+glS.secretMasked+')':''}</div>
        ${glS.liveKeys?'<div style="font-size:12.5px;color:var(--mut)">Connected in live mode — real money moves now.</div>':`
        <div style="font-size:12.5px;color:var(--mut);margin-bottom:8px">Swap the sandbox keys for your live pair (Dashboard → Developers → API keys).</div>
        <input id="gl-pk" placeholder="pk_live_…" style="width:100%;margin-bottom:6px" autocomplete="off">
        <input id="gl-sk" type="password" placeholder="sk_live_…" style="width:100%;margin-bottom:8px" autocomplete="new-password">
        <button class="btn" onclick="goliveSaveKeys()">Save live keys</button>`}
      </div>
      <div style="border:1px solid var(--line);border-radius:12px;padding:14px">
        <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${glS.taxActivated===true?'var(--green)':(glS.taxActivated===false?'var(--orange)':'var(--text-dim)')};margin-bottom:6px">${glS.taxActivated===true?'✓':'2.'} Stripe Tax ${glS.taxActivated===true?'active':''}</div>
        <div style="font-size:12.5px;color:var(--mut);margin-bottom:8px">${glS.taxNote}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <a class="btn ghost sm" href="https://dashboard.stripe.com/tax" target="_blank" rel="noopener">Open Dashboard → Tax</a>
          ${glS.taxActivated!==true?'<button class="btn sm" onclick="goliveTaxRecheck()">Check again</button>':''}
        </div>
      </div>
      <div style="border:1px solid var(--line);border-radius:12px;padding:14px">
        <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:${glS.webhookSet?'var(--green)':'var(--orange)'};margin-bottom:6px">${glS.webhookSet?'✓':'3.'} Payment webhooks ${glS.webhookSet?'('+glS.webhookMasked+')':''}</div>
        ${glS.webhookSet?'<div style="font-size:12.5px;color:var(--mut)">Signed events flow back — paid invoices update themselves.</div>':`
        <div style="font-size:12.5px;color:var(--mut);margin-bottom:6px">In <a href="https://dashboard.stripe.com/webhooks" target="_blank" rel="noopener">Dashboard → Developers → Webhooks</a>, add endpoint:</div>
        <code style="display:block;font-size:12px;background:var(--bg);padding:8px 10px;border-radius:8px;margin-bottom:8px;word-break:break-all">${location.origin}/api/stripe/webhook</code>
        <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:8px">Listen for: invoice.paid · invoice.payment_failed · checkout.session.completed · credit_note.created</div>
        <input id="gl-wh" placeholder="whsec_… (signing secret)" style="width:100%;margin-bottom:8px" autocomplete="off">
        <button class="btn" onclick="goliveSaveWebhook()">Save webhook secret</button>`}
      </div>
    </div>
  </div>`:'';
  const aiBanner = (aiS && !aiS.configured) ? `
  <div class="panel" style="--accent:var(--cyan);margin-bottom:16px;background:radial-gradient(120% 140% at 15% 0%,rgba(94,114,228,.14),transparent 60%),var(--panel)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
      <div><h3 style="margin:0 0 4px">🤖 One step left — connect an AI provider</h3>
      <div style="font-size:12.5px;color:var(--mut)">The agents currently run on built-in heuristics. Add a key (the OpenRouter free tier works out of the box) to unlock live AI across all 31 agents — and generate your OpenCode key in the same step.</div></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <button class="btn" onclick="aiSetupRun()">Generate OpenCode key</button>
        <a class="btn ghost" href="admin.html#settings">Manage providers →</a>
        <button class="btn sm ghost" onclick="aiSetupDismiss()" title="Dismiss">✕</button>
      </div>
    </div>
  </div>` : '';
  const glBanner = (gl && gl.status && gl.status.status !== 'live' && ['owner','admin'].includes(OS.USER.role)) ? `
  <div class="panel" style="--accent:var(--lime);margin-bottom:16px;background:radial-gradient(120% 140% at 15% 0%,rgba(67,209,124,.14),transparent 60%),var(--panel)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
      <div><h3 style="margin:0 0 4px">🚀 Go Live — launch your business</h3>
      <div style="font-size:12.5px;color:var(--mut)">${gl.status.erasedDemo?'Demo cleared ✓ · ':''}Launch checklist ${gl.progress.pct}% (${gl.progress.done}/${gl.progress.tasks})${gl.launchDate?' · launching <b>'+gl.launchDate+'</b>':''}${gl.progress.overdue?` · <b style="color:#ff8a8a">${gl.progress.overdue} overdue</b>`:''}</div></div>
      <a class="btn" href="golive.html">Open Go Live →</a>
    </div>
  </div>` : '';
  const APPS_PANEL = `
  <div class="panel" style="text-align:center;--accent:var(--cyan)"><h3 style="justify-content:center">Get the Apps</h3>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px">
      ${[['Android','M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm5 15h.01'],['iOS','M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0-5a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'],['macOS','M4 4h16v12H4zM2 18h20v2H2z'],['Windows','M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z'],['Linux','M12 2a6 6 0 0 1 6 6c0 2.5-1.5 3.5-1.5 6h-9C7.5 11.5 6 10.5 6 8a6 6 0 0 1 6-6zm-5 14h10l1.5 6h-13z']].map(a => `
      <a href="https://github.com/projectzerodays/lines-and-logos/releases/latest" target="_blank" rel="noopener" class="btn ghost" style="flex-direction:column;gap:8px;padding:16px 18px;min-width:100px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${a[1]}"/></svg>
        <span style="font-size:12px;font-weight:700">${a[0]}</span>
      </a>`).join('')}
    </div>
    <p style="font-size:11.5px;color:var(--text-dim);margin-top:12px">Business OS apps for every platform — grab the latest release and log in with your staff account.</p>
  </div>`;
  OS.$('#view').innerHTML= goliveCard + aiBanner + glBanner + APPS_PANEL + `
  <div class="kpis">
    <div class="kpi" style="--accent:var(--blue-hi)"><div class="lbl">Pipeline Value</div><div class="val">${fmt(s.pipeline)}</div><div class="delta" style="--c:var(--green)">▲ open quotes & jobs</div></div>
    <div class="kpi" style="--accent:var(--yellow)"><div class="lbl">Outstanding</div><div class="val">${fmt(s.outstanding)}</div><div class="delta" style="--c:var(--yellow)">${s.overdueCount} overdue</div></div>
    <div class="kpi" style="--accent:var(--orange)"><div class="lbl">Hot Leads</div><div class="val">${s.hotLeads}</div><div class="delta" style="--c:var(--orange)">▲ scored by AI agent</div></div>
    <div class="kpi" style="--accent:var(--lime)"><div class="lbl">Active Jobs</div><div class="val">${s.activeJobs}</div><div class="delta" style="--c:var(--green)">${s.crew} crew ready</div></div>
  </div>
  <div class="grid-2">
    <div class="panel" style="--accent:var(--blue-hi)"><h3>Pipeline by Job</h3><canvas class="chart" id="pipe"></canvas></div>
    <div class="panel" style="--accent:var(--cyan)"><h3>Agent Activity <span class="right"><a href="admin.html">agents console →</a></span></h3><div class="activity">
      ${activity.slice(0,12).map(a=>`<div class="act"><span class="dot"></span><span class="t">${ago(a.t)}</span><span>${esc(a.msg)}</span></div>`).join('')||'<div class="empty">No agent activity yet</div>'}
    </div></div>
  </div>
  <div class="grid-2 eq">
    <div class="panel" style="--accent:var(--orange)"><h3>Top Leads <span class="right"><a href="sales.html">all leads →</a></span></h3><div class="table-wrap"><table>
      <tr><th>Name</th><th>Score</th><th>Tier</th><th>Stage</th></tr>
      ${leads.slice(0,4).map(l=>`<tr><td><b>${esc(l.name)}</b><span class="sub">${esc(l.company)}</span></td><td><b style="color:var(--cyan)">${l.score}</b></td><td><span class="tag ${TIER(l.tier)}">${l.tier}</span></td><td>${l.stage}</td></tr>`).join('')}
    </table></div></div>
    <div class="panel" style="--accent:var(--yellow)"><h3>Invoice Aging <span class="right"><a href="finance.html">finance →</a></span></h3><div class="table-wrap"><table>
      <tr><th>Number</th><th>Account</th><th>Amount</th><th>Status</th></tr>
      ${invoices.map(i=>`<tr><td><b>${esc(i.number)}</b></td><td>${esc(i.account)}</td><td>${fmt(i.amount)}</td><td><span class="tag ${INV(i.status)}">${i.status}</span></td></tr>`).join('')}
    </table></div></div>
  </div>`;
  drawPipe(jobs);
}
function drawPipe(jobs){
  const c=OS.$('#pipe');if(!c)return;
  const dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  c.width=W*dpr;c.height=H*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const list=jobs.slice(0,5);if(!list.length)return;
  const max=Math.max(...list.map(j=>j.value));
  list.forEach((j,i)=>{
    const y=18+i*((H-36)/Math.max(1,list.length-1||1));
    const w=Math.max(24,(j.value/max)*(W-190));
    x.font='600 12px Space Grotesk';x.fillStyle='#7e8cab';x.fillText((j.title||'').slice(0,22),4,y+4);
    const g=x.createLinearGradient(130,0,130+w,0);g.addColorStop(0,'#4d7dff');g.addColorStop(1,'#57c7ff');
    x.fillStyle='rgba(120,145,205,.1)';rr(x,130,y-6,W-140,12,6);x.fill();
    x.fillStyle=g;rr(x,130,y-6,w,12,6);x.fill();
    x.fillStyle='#eef3fc';x.font='700 12px Space Grotesk';x.fillText(fmt(j.value),138+w,y+4);
  });
  function rr(x,a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)}
}
async function vReports(s,accounts,jobs,invoices){
  const brief=await OS.cron('daily');
  const gross=(s.collected||0)+s.outstanding, net=(s.collected||0)-(s.expensesTotal||0);
  OS.$('#view').innerHTML=`
  <div class="kpis k3">
    <div class="kpi" style="--accent:var(--green)"><div class="lbl">Collected (all time)</div><div class="val">${fmt(s.collected||0)}</div><div class="delta" style="--c:var(--green)">cash in</div></div>
    <div class="kpi" style="--accent:var(--red)"><div class="lbl">Expenses</div><div class="val">${fmt(s.expensesTotal||0)}</div><div class="delta" style="--c:var(--red)">materials · equipment · travel</div></div>
    <div class="kpi" style="--accent:var(--cyan)"><div class="lbl">Net Position</div><div class="val">${fmt(net)}</div><div class="delta" style="--c:${net>=0?'var(--green)':'var(--red)'}">${net>=0?'▲ profitable':'▼ at risk'}</div></div>
  </div>
  <div class="grid-2 eq">
    <div class="panel" style="--accent:var(--lime)"><h3>Daily Ops Brief <span class="right">Daily Ops Agent · ${brief.date||''}</span></h3>
      <div class="bar-row"><span class="n">Jobs in progress</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(brief.jobsToday||[]).length*34)}%"></div></div><span class="amt">${(brief.jobsToday||[]).length}</span></div>
      <div class="bar-row"><span class="n">Open quotes</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(brief.openQuotes||[]).length*34)}%"></div></div><span class="amt">${(brief.openQuotes||[]).length}</span></div>
      <div class="bar-row"><span class="n">Overdue invoices</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(brief.overdueInvoices||[]).length*34)}%;background:linear-gradient(90deg,#ff7a1a,#ff5a5a)"></div></div><span class="amt">${(brief.overdueInvoices||[]).length}</span></div>
      <div class="bar-row"><span class="n">Hot leads</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(brief.hotLeads||[]).length*34)}%;background:linear-gradient(90deg,#ff7a1a,#ffc21c)"></div></div><span class="amt">${(brief.hotLeads||[]).length}</span></div>
      <div class="bar-row"><span class="n">Pending approvals</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,(brief.pendingApprovals||0)*34)}%"></div></div><span class="amt">${brief.pendingApprovals||0}</span></div>
    </div>
    <div class="panel" style="--accent:var(--volley)"><h3>Account Health <span class="right">Health Score Agent</span></h3><div class="table-wrap"><table>
      <tr><th>Account</th><th>Tier</th><th>Health</th></tr>
      ${accounts.map(a=>`<tr><td><b>${esc(a.name)}</b><span class="sub">${esc((a.healthNotes||[])[0]||'')}</span></td><td><span class="tag t-blue">${a.tier}</span></td><td><span class="hdot h-${a.health}">${a.health}</span></td></tr>`).join('')}
    </table></div></div>
  </div>
  <div class="panel" style="--accent:var(--yellow)"><h3>Weekly KPI Snapshot <span class="right">runs Mondays via /api/cron/weekly</span></h3><div class="table-wrap"><table>
    <tr><th>Metric</th><th>Value</th><th>Metric</th><th>Value</th></tr>
    <tr><td>Total leads</td><td><b>${OS.cur('leads').length}</b></td><td>Pipeline value</td><td><b>${fmt(s.pipeline)}</b></td></tr>
    <tr><td>Gross invoiced</td><td><b>${fmt(gross)}</b></td><td>Outstanding</td><td><b>${fmt(s.outstanding)}</b></td></tr>
    <tr><td>Open quotes</td><td><b>${s.openQuotes||0}</b></td><td>Open tickets</td><td><b>${s.openTickets||0}</b></td></tr>
    <tr><td>Active jobs</td><td><b>${s.activeJobs}</b></td><td>Crew (1099)</td><td><b>${s.crew}</b></td></tr>
  </table></div></div>`;
}
async function runDaily(){
  const brief=await OS.cron('daily');
  OS.toast('Daily Ops Agent brief generated — see Reports tab');
  if(view!=='reports')go('reports');else render();
}
function newLead(){
  OS.openModal('New Lead',`
    <label>Contact Name</label><input id="f-name" placeholder="Jane Doe">
    <label>Company / Facility</label><input id="f-company" placeholder="DeSoto County Schools">
    <label>Service Needed</label><select id="f-service"><option>Full Facility</option><option>Gym Refresh</option><option>Court Restripe</option><option>Wall Wraps</option><option>Donors Wall</option><option>Signage & Striping</option><option>Playground Surfacing</option></select>
    <label>Source</label><select id="f-source"><option>Website</option><option>Referral</option><option>Outbound</option><option>Cold call</option></select>`);
  OS.onModalSave(async()=>{
    const r=await OS.create('leads',{name:OS.field('f-name')||'Unknown',company:OS.field('f-company')||'Unknown',service:OS.field('f-service'),source:OS.field('f-source'),stage:'new'});
    OS.closeModal();OS.toast(`Lead created — AI scored ${r.score} (${r.tier})`);render();
  });
}
</script>
<script src="assets/pwa.js" defer></script>
<!-- Lines & Logos Business OS -->
</body>
</html>
