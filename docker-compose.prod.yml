version: "3.9"

# Production stack: app + Caddy (automatic HTTPS).
#   DOMAIN=linesandlogosteam.com EMAIL=you@email docker compose -f docker-compose.prod.yml up -d
# Data persists in the `lines-data` volume (db.json, uploads, backups).

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # STRIPE_SECRET_KEY: sk_live_...
      # STRIPE_PUBLISHABLE_KEY: pk_live_...
      # STRIPE_WEBHOOK_SECRET: whsec_...
      # LLAMA_HOME: /home/lines/llama
    volumes:
      - lines-data:/app/data
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-linesandlogosteam.com}
      EMAIL: ${EMAIL:-info@linesandlogos.team}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  lines-data:
  caddy-data:
  caddy-config:

networks:
  internal:
