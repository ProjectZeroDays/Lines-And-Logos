<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents &amp; Funding — Lines &amp; Logos</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/os.css?v=9">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060d">
<style>
.doc-card{background:var(--panel,#0d1526);border:1px solid var(--line,#1c2946);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.doc-card h3{margin:0;font-size:15px}
.doc-card p{font-size:12.5px;color:var(--mut,#8b95b3);margin:0;flex:1}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.grant-row{display:flex;gap:14px;align-items:flex-start;background:var(--panel,#0d1526);border:1px solid var(--line,#1c2946);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:13px;flex-wrap:wrap}
.grant-row.locked{opacity:.55}
.grant-row h4{margin:0 0 3px;font-size:14px}
.grant-row .amt{color:#43d17c;font-weight:700;font-size:12.5px}
.grant-row .why{color:var(--mut,#8b95b3);font-size:12px;margin-top:4px}
.grant-row .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:#0f2b1c;color:#43d17c}.pill.lock{background:#1a2438;color:#8b95b3}.pill.appr{background:#0f2233;color:#5bb8ff}.pill.sub{background:#2a1c44;color:#c9a6ff}
.pb-stage{background:var(--panel,#0d1526);border:1px solid var(--line,#1c2946);border-radius:14px;padding:18px;margin-bottom:14px}
.pb-stage h3{margin:0 0 8px;font-size:15px}
.pb-stage ol{margin:6px 0;padding-left:20px;font-size:13px}
.pb-stage li{margin:4px 0}
.pb-stage a{color:#5bb8ff;text-decoration:none;font-size:12.5px}
.sub-row{background:var(--panel,#0d1526);border:1px solid var(--line,#1c2946);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:13px}
.profile-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;background:var(--panel,#0d1526);border:1px solid var(--line,#1c2946);border-radius:14px;padding:18px;margin-bottom:16px}
.profile-form label{font-size:12px;color:var(--mut,#8b95b3);display:flex;flex-direction:column;gap:4px}
.profile-form input[type=text],.profile-form input[type=number]{padding:9px;border-radius:9px;border:1px solid var(--line,#1c2946);background:#0a1122;color:var(--tx,#e8ecf6)}
.chk{display:flex;flex-direction:row!important;align-items:center;gap:7px;font-size:13px;color:var(--tx,#dfe5f3)!important}
.chk input{width:16px;height:16px;accent-color:#43d17c}
.md-out{background:#0a1122;border:1px solid var(--line,#1c2946);border-radius:12px;padding:16px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;max-height:400px;overflow:auto;margin-top:10px}
</style>
</head>
<body data-perms="notifications">
<main>
  <div class="topbar">
    <div><div class="crumb">Business Suite / Documents &amp; Funding</div><h1 class="chrome">Documents &amp; Funding</h1></div>
    <div class="topbar-right"><button class="btn btn-sm" onclick="editProfile()">Eligibility Profile</button></div>
  </div>
  <div class="tabs2" id="tabs"></div>
  <div id="view"></div>
</main>
<script src="assets/os.js?v=9"></script>
<script>
const { boot, raw, fmt, ago, esc, openModal, closeModal, onModalSave, field, toast, isLive, $ } = OS;
let TAB = 'docs';
const TABS = [['docs','Documents'],['playbook','Funding Playbook'],['grants','Grants']];

async function render(){ $('#tabs').innerHTML = TABS.map(([k,l])=>`<button class="${k===TAB?'on':''}" onclick="TAB='${k}';render()">${l}</button>`).join('');
  if (TAB==='docs') renderDocs(); else if (TAB==='playbook') renderPlaybook(); else renderGrants(); }

const DOCS = [
  {type:'operating-agreement', icon:'📜', name:'Operating Agreement', desc:'Single-member LLC operating agreement generated from your profile + equipment schedule. Attorney-review noted.'},
  {type:'business-plan', icon:'📋', name:'Business Plan', desc:'Full plan from live data: financials, market, ops, milestones, use of funds. Refresh before every lender meeting.'},
  {type:'pitch-deck', icon:'🎤', name:'Pitch Deck', desc:'12-slide outline with real traction numbers — pair with visuals for investors/grant panels.'},
];
async function renderDocs(){
  const docs = isLive() ? await raw('/api/funding/documents').catch(()=>[]) : [];
  $('#view').innerHTML = `<div class="doc-grid">${DOCS.map(d=>`
    <div class="doc-card"><h3>${d.icon} ${d.name}</h3><p>${d.desc}</p>
      <div style="display:flex;gap:8px"><button class="btn btn-sm" onclick="gen('${d.type}')">Generate</button></div>
    </div>`).join('')}</div>
    ${docs.length?`<div class="section-title" style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut,#8b95b3);margin:22px 0 12px">Previously generated</div>
    ${docs.map(d=>`<div class="sub-row"><b>${esc(d.title)}</b> · ${d.wordCount} words · ${ago(d.generatedAt)} <button class="btn btn-ghost btn-sm" style="float:right" onclick="viewDoc('${d.id}')">View</button></div>`).join('')}`:''}
    <div id="docOut"></div>`;
}
async function gen(type){
  if (!isLive()) { toast('Connect the server to generate documents'); return; }
  const d = await raw('/api/funding/documents/' + type + '/generate', { method:'POST' });
  $('#docOut').innerHTML = `<div class="md-out">${esc(d.markdown.slice(0, 3500))}${d.markdown.length>3500?'…':''}</div>`;
  const blob = new Blob([d.markdown], { type:'text/markdown' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = d.type + '-' + Date.now() + '.md'; a.click();
  toast(d.title + ' generated & downloaded');
}
async function viewDoc(id){
  const docs = await raw('/api/funding/documents');
  const d = docs.find(x=>x.id===id);
  if (d) $('#docOut').innerHTML = `<div class="md-out">${esc(d.markdown.slice(0,3500))}${d.markdown.length>3500?'…':''}</div>`;
}

async function renderPlaybook(){
  const pb = isLive() ? await raw('/api/funding/playbook').catch(()=>[]) : demoPb();
  $('#view').innerHTML = pb.map(s=>`<div class="pb-stage"><h3>${esc(s.stage)}</h3>
    <ol>${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    ${(s.resources||[]).map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)} ↗</a>`).join(' · ')}
  </div>`).join('');
}
function demoPb(){ return [
  {stage:'1. Prepare the pack',steps:['Generate the three documents — most lenders ask for exactly these','Export P/L from Finance; gather tax returns + COIs','Fix the cheapest gaps: Google reviews + GBP verification'],resources:[{name:'SBA loan checklist',url:'https://www.sba.gov/business-guide/plan-your-business/small-business-loans-grants'}]},
  {stage:'2. Start with free advisors',steps:['Book a FREE TN SBDC advisor (tnsbdc.org)','Memphis: HOPE Enterprise Corp — local CDFI','Ask your bank for an SBA 7(a)'],resources:[{name:'SBA Lender Match',url:'https://lenders.sba.gov/'}]},
]; }

async function renderGrants(){
  if (!isLive()) { $('#view').innerHTML = '<p class="empty">Connect the server for live grant matching. Set your eligibility profile (button above) — the agent re-matches instantly and sweeps weekly.</p>'; return; }
  const [grants, subs] = await Promise.all([raw('/api/funding/grants'), raw('/api/funding/submissions').catch(()=>[])]);
  $('#view').innerHTML = `
    ${subs.length?`<div class="section-title" style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut,#8b95b3);margin:0 0 12px">Submissions awaiting your approval</div>
    ${subs.map(s=>`<div class="sub-row"><span class="pill ${s.status==='approved'?'appr':s.status==='submitted'?'sub':'pending-approval'}">${s.status}</span> <b>${esc(s.grantName)}</b> · drafted ${ago(s.draftedAt)}
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        ${s.status==='pending-approval'?`<button class="btn btn-sm" onclick="approveSub('${s.id}')">Approve draft</button>`:''}
        ${s.status==='approved'?`<button class="btn btn-sm" onclick="submitSub('${s.id}')">✓ Mark submitted</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="viewSub('${s.id}')">View draft</button>
      </div></div>`).join('')}`:''}
    <div class="section-title" style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut,#8b95b3);margin:20px 0 12px">Matched for you</div>
    ${grants.map(g=>`<div class="grant-row ${g.eligible?'':'locked'}">
      <div style="flex:1;min-width:230px"><h4>${esc(g.name)} ${g.eligible?'<span class="pill ok">eligible</span>':'<span class="pill lock">update profile</span>'}</h4>
      <div class="amt">${esc(g.amount)} · ${esc(g.source)} · ${esc(g.cycle)}</div>
      <div class="why">${esc(g.fit)} ${g.matchReasons.length?'<br>✓ '+esc(g.matchReasons.join('; ')):''}</div></div>
      <div class="acts">
        <a class="btn btn-ghost btn-sm" href="${esc(g.url)}" target="_blank" rel="noopener">Site ↗</a>
        ${g.eligible?`<button class="btn btn-sm" onclick="draftGrant('${g.id}')">Write draft</button>`:''}
      </div></div>`).join('')}`;
}
async function draftGrant(id){
  try { const s = await raw('/api/funding/grants/' + id + '/draft', { method:'POST' }); toast('Draft written — awaiting your approval'); renderGrants(); }
  catch (e) { toast(e.error || 'Could not draft'); }
}
async function approveSub(id){ await raw('/api/funding/submissions/' + id + '/approve', { method:'POST' }); toast('Approved — file it at the grant site, then mark submitted'); renderGrants(); }
async function submitSub(id){ await raw('/api/funding/submissions/' + id + '/submit', { method:'POST' }); toast('Marked submitted — good luck!'); renderGrants(); }
async function viewSub(id){
  const subs = await raw('/api/funding/submissions');
  const s = subs.find(x=>x.id===id);
  if (s) openModal('Draft — ' + s.grantName, `<div class="md-out" style="max-height:60vh">${esc(s.draft)}</div>`);
}

function editProfile(){
  const p = isLive() ? {} : {};
  openModal('Eligibility profile', `
    <p class="hint" style="margin-top:0;font-size:12.5px;color:var(--mut)">These flags determine which grants match. Saving re-runs the matcher instantly.</p>
    <div class="profile-form">
      <label>Owner full name<input type="text" id="fp_name" placeholder="Jane Smith"></label>
      <label>Years in business<input type="number" id="fp_years" placeholder="3"></label>
      <label>Annual revenue ($)<input type="number" id="fp_rev" placeholder="400000"></label>
      <label class="chk"><input type="checkbox" id="fp_vet"> Veteran-owned</label>
      <label class="chk"><input type="checkbox" id="fp_woman"> Woman-owned</label>
      <label class="chk"><input type="checkbox" id="fp_min"> Minority-owned</label>
      <label class="chk"><input type="checkbox" id="fp_rural"> Rural location</label>
    </div>`);
  if (isLive()) raw('/api/funding/profile').then(p=>{
    const set=(id,v)=>{const el=$(id); if(el){ if(el.type==='checkbox') el.checked=!!v; else el.value=v||''; }};
    set('#fp_name',p.ownerName); set('#fp_years',p.yearsInBusiness); set('#fp_rev',p.annualRevenue);
    set('#fp_vet',p.veteran); set('#fp_woman',p.womanOwned); set('#fp_min',p.minorityOwned); set('#fp_rural',p.ruralLocation);
  }).catch(()=>{});
  onModalSave(async (vals) => {
    const body = { ownerName: $('#fp_name').value || null, yearsInBusiness: +$('#fp_years').value || null,
      annualRevenue: +$('#fp_rev').value || null, veteran: $('#fp_vet').checked, womanOwned: $('#fp_woman').checked,
      minorityOwned: $('#fp_min').checked, ruralLocation: $('#fp_rural').checked };
    if (isLive()) { const r = await raw('/api/funding/profile', { method:'POST', body: JSON.stringify(body) }); toast(r.newEligible ? 'Profile saved — ' + r.newEligible + ' new grant match(es)!' : 'Profile saved — grants re-matched'); }
    else toast('Profile saved (demo)');
    closeModal(); if (TAB==='grants') renderGrants();
  });
}

boot('funding', 'Documents & Funding', async () => { await render(); });
</script>
</body>
</html>
