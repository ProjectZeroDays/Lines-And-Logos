<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Live — Lines &amp; Logos</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/os.css?v=9">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060d">
<style>
.steps{display:flex;gap:8px;margin:0 0 22px;flex-wrap:wrap}
.step{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:7px 14px;border-radius:99px;border:1px solid var(--line,#1c2946);color:var(--mut,#8b95b3);background:transparent;cursor:pointer}
.step.on{background:linear-gradient(180deg,#4d7dff,#2d5bff);color:#fff;border-color:transparent}
.step.done{color:#43d17c;border-color:#1c4430}
.gl-hero{background:radial-gradient(120% 140% at 20% 0%,rgba(77,125,255,.22),transparent 55%),var(--panel,#0d1526);border:1px solid var(--line,#1c2946);border-radius:18px;padding:28px;margin-bottom:20px}
.gl-hero h2{margin:0 0 8px;font-size:24px}
.gl-bar{height:10px;border-radius:99px;background:#131d36;overflow:hidden;margin:14px 0 6px}
.gl-bar i{display:block;height:100%;background:linear-gradient(90deg,#43d17c,#2d5bff);transition:width .4s}
.phase{background:var(--panel,#0d1526);border:1px solid var(--line,#1c2946);border-radius:14px;margin-bottom:14px;overflow:hidden}
.phase>header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer}
.phase>header h3{margin:0;font-size:15px}
.phase .body{padding:0 18px 16px;display:none}
.phase.open .body{display:block}
.task{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--line,#1c2946);font-size:13.5px}
.task input[type=checkbox]{width:18px;height:18px;accent-color:#43d17c;flex:none}
.task.done span.t{text-decoration:line-through;color:var(--mut,#8b95b3)}
.task input[type=date]{margin-left:auto;background:#0a1122;border:1px solid var(--line,#1c2946);color:var(--tx,#e8ecf6);border-radius:8px;padding:5px 8px;font-size:12px}
.task .due-chip{font-size:11px;padding:2px 8px;border-radius:99px;margin-left:auto}
.due-chip.overdue{background:#3a1212;color:#ff8a8a}.due-chip.soon{background:#3a2c10;color:#f5b942}.due-chip.ok{background:#0f2b1c;color:#43d17c}
.erase-warn{background:#2a1216;border:1px solid #5b2330;border-radius:12px;padding:16px 18px;margin:14px 0}
.keep-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.keep-grid>div{background:var(--panel,#0d1526);border:1px solid var(--line,#1c2946);border-radius:12px;padding:14px}
.keep-grid h4{margin:0 0 8px;font-size:13px}
.keep-grid ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--mut,#8b95b3)}
.confirm-input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line,#1c2946);background:#0a1122;color:var(--tx);font-size:15px;letter-spacing:.15em;text-transform:uppercase;margin:10px 0}
.big-go{width:100%;padding:20px;font-size:19px;font-weight:800;border-radius:16px;border:none;cursor:pointer;color:#fff;background:linear-gradient(180deg,#43d17c,#1f9e52);box-shadow:0 14px 44px rgba(31,158,82,.4)}
.big-go:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.launch-date-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.launch-date-row input{background:#0a1122;border:1px solid var(--line,#1c2946);color:var(--tx);border-radius:10px;padding:11px 13px;font-size:14px}
.mile-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:13px}
.mile-list div{display:flex;gap:10px;align-items:center;background:#0a1122;border:1px solid var(--line,#1c2946);border-radius:10px;padding:10px 13px}
.mile-list b{min-width:86px;color:#5bb8ff}
.selftest-out{background:#0a1122;border:1px solid var(--line,#1c2946);border-radius:12px;padding:16px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre-wrap;max-height:340px;overflow:auto}
@media(max-width:640px){.keep-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-perms="notifications">
<main>
  <div class="topbar">
    <div><div class="crumb">Business Suite / Go Live</div><h1 class="chrome">Go Live</h1></div>
    <div class="topbar-right"><span class="pill" id="statusPill">setup</span></div>
  </div>
  <div class="steps" id="steps"></div>
  <div id="view"></div>
</main>
<script src="assets/os.js?v=9"></script>
<script>
const { boot, raw, fmt, ago, esc, isLive, toast, $ } = OS;
let STEP = 0, DATA = null;
const STEPS = ['Readiness','Erase Demo','Launch Checklist','Timeline','Go Live'];

async function load(){ DATA = isLive() ? await raw('/api/golive') : await demoLoad(); render(); }

async function demoLoad(){
  const D = OS.cur('launchTasks') || [];
  if (!D.length) for (const ph of OS.demoGoLivePhases || []) {} // noop safeguard
  return { status: OS.demoGoLive || { status:'setup' }, progress: demoProgress(D), phases: [], launchDate: (OS.demoGoLive||{}).launchDate || null, demo: true };
}
function demoProgress(tasks){
  const done = tasks.filter(t=>t.done).length;
  return { tasks: tasks.length, done, pct: tasks.length?Math.round(done/tasks.length*100):0, overdue: tasks.filter(t=>!t.done&&t.due&&new Date(t.due)<new Date()).length, overdueTasks: [], phases: [] };
}

function render(){
  renderSteps();
  if (STEP===0) stepReadiness();
  else if (STEP===1) stepErase();
  else if (STEP===2) stepChecklist();
  else if (STEP===3) stepTimeline();
  else stepGo();
}

function renderSteps(){
  $('#steps').innerHTML = STEPS.map((s,i)=>{
    const cls = i<STEP?'done':i===STEP?'on':'';
    return `<button class="step ${cls}" onclick="STEP=${i};render()">${i+1}. ${s}</button>`;
  }).join('');
}

function phaseDone(ph){ return DATA.phases.find(p=>p.key===ph); }

function stepReadiness(){
  const p = DATA.progress || {pct:0,done:0,tasks:0,overdue:0};
  const live = DATA.status && DATA.status.status === 'live';
  $('#view').innerHTML = `
  <div class="gl-hero">
    <h2>${live ? '🚀 You are LIVE' : 'Ready to launch your business?'}</h2>
    <p style="color:var(--mut);max-width:640px">This wizard walks you through going live: clear out demo content, work the launch checklist, set your launch date with calendar milestones and reminders, then flip the switch.</p>
    <div class="gl-bar"><i style="width:${p.pct}%"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)">
      <span>Launch checklist: ${p.pct}% (${p.done}/${p.tasks})</span>
      ${p.overdue?`<span style="color:#ff8a8a">${p.overdue} overdue</span>`:`<span>${p.overdue===0&&p.tasks?'On track ✓':''}</span>`}
    </div>
    ${!live?`<button class="btn" style="margin-top:18px" onclick="STEP=1;render()">Start the Go Live wizard →</button>`:''}
    <details style="margin-top:18px"><summary style="cursor:pointer;font-size:13px;color:var(--mut)">🔬 Run the self-test loop (up to 1000 passes)</summary>
      <div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="runSelfTest(100)">100 passes</button>
        <button class="btn btn-ghost btn-sm" onclick="runSelfTest(1000)">1000 passes</button>
        <button class="btn btn-ghost btn-sm" onclick="runSelfTest(10)">Quick 10</button>
      </div>
      <div id="stOut" style="margin-top:12px"></div>
    </details>
  </div>`;
}

async function runSelfTest(n){
  const out = $('#stOut');
  out.innerHTML = '<div class="selftest-out">Running '+n+'-pass loop…</div>';
  let r;
  if (isLive()) r = await raw('/api/selftest/run', { method:'POST', body: JSON.stringify({ iterations: n }) });
  else r = { passes: n, cleanPasses: 3, bugsFound: 0, failures: [], verdict: 'CLEAN (demo mode — connect the server for real results)' };
  out.innerHTML = `<div class="selftest-out">${esc(JSON.stringify(r, null, 2))}</div>`;
  toast('Self-test: ' + r.verdict);
}

function stepErase(){
  const st = DATA.status || {};
  $('#view').innerHTML = `
  <div class="gl-hero">
    <h2>Erase demo content</h2>
    <p style="color:var(--mut)">Demo records (fake schools, jobs, invoices, gallery photos, chats) get wiped so you start clean. Your login, company settings, and this wizard are kept.</p>
    <div class="keep-grid">
      <div><h4 style="color:#43d17c">✓ Kept</h4><ul><li>Your user accounts (login keeps working)</li><li>Company settings & branding</li><li>This Go Live checklist</li></ul></div>
      <div><h4 style="color:#ff8a8a">✗ Removed</h4><ul><li>Demo leads, quotes, jobs, contracts</li><li>Demo invoices, expenses, payments</li><li>Demo gallery, reviews, inquiries, chats</li><li>All agent-generated demo history</li></ul></div>
    </div>
    ${st.erasedDemo ? `<p style="color:#43d17c;font-weight:700">✓ Demo content erased ${ago(st.erasedAt)}</p>` : `
    <div class="erase-warn"><b>⚠ Irreversible.</b> Type <b>ERASE</b> below to confirm.</div>
    <input class="confirm-input" id="eraseConfirm" placeholder="TYPE ERASE" autocomplete="off">
    <button class="btn" id="eraseBtn" onclick="doErase()">Erase demo content</button>`}
    <div style="margin-top:20px"><button class="btn btn-ghost" onclick="STEP=2;render()">${st.erasedDemo?'Continue to checklist →':'Skip — I\'ll erase later →'}</button></div>
  </div>`;
}

async function doErase(){
  const v = $('#eraseConfirm').value.trim().toUpperCase();
  if (v !== 'ERASE') { toast('Type ERASE to confirm'); return; }
  if (!confirm('Erase ALL demo content? This cannot be undone.')) return;
  if (isLive()) { await raw('/api/golive/erase-demo', { method:'POST', body: JSON.stringify({ confirm: 'ERASE' }) }); }
  else { (OS.demoGoLive = OS.demoGoLive || {}).erasedDemo = true; (OS.demoGoLive).erasedAt = new Date().toISOString(); OS.persistDemo(); }
  toast('Demo content erased'); load();
}

function stepChecklist(){
  const phases = DATA.phases || [];
  const tasks = isLive() ? (DATA.tasks || []) : (OS.cur('launchTasks') || []);
  $('#view').innerHTML = `<div id="phases">${phases.map(ph => `
    <div class="phase ${ph.pct<100?'open':''}">
      <header onclick="this.parentElement.classList.toggle('open')">
        <h3>${esc(ph.name)} <span style="color:var(--mut);font-weight:400;font-size:12px">— ${esc(ph.hint)}</span></h3>
        <span class="pill ${ph.pct===100?'approved':'pending-approval'}">${ph.done}/${ph.total}</span>
      </header>
      <div class="body">${tasks.filter(t=>t.phase===ph.key).map(t=>{
        const overdue = !t.done && t.due && new Date(t.due) < new Date();
        const soon = !t.done && t.due && !overdue && (new Date(t.due)-Date.now())/864e5 <= 3;
        return `<div class="task ${t.done?'done':''}">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}', this.checked)">
          <span class="t">${esc(t.text)}</span>
          ${t.due && !t.done ? `<span class="due-chip ${overdue?'overdue':soon?'soon':'ok'}">${overdue?'overdue · ':''}${t.due.slice(5)}</span>`
            : `<input type="date" value="${t.due||''}" onchange="setDue('${t.id}', this.value)" title="Set deadline">`}
        </div>`; }).join('')}</div>
    </div>`).join('')}</div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
      <button class="btn" onclick="STEP=3;render()">Set launch timeline →</button>
      <button class="btn btn-ghost" onclick="STEP=0;render()">Back</button>
    </div>`;
}

async function toggleTask(id, done){
  if (isLive()) await raw('/api/golive/task', { method:'POST', body: JSON.stringify({ id, done }) });
  else { const t=(OS.cur('launchTasks')||[]).find(x=>x.id===id); if(t){t.done=done;OS.persistDemo();} }
  toast(done?'Task done ✓':'Task reopened'); load();
}
async function setDue(id, due){
  if (isLive()) await raw('/api/golive/task', { method:'POST', body: JSON.stringify({ id, due }) });
  else { const t=(OS.cur('launchTasks')||[]).find(x=>x.id===id); if(t){t.due=due;OS.persistDemo();} }
  toast('Deadline set'); load();
}

function stepTimeline(){
  const ld = DATA.launchDate;
  $('#view').innerHTML = `
  <div class="gl-hero">
    <h2>Launch timeline</h2>
    <p style="color:var(--mut)">Pick your target launch date — the app schedules phase milestones on your calendar and sets reminders at T-7, T-2 and T-1 days so you stay on track.</p>
    <div class="launch-date-row">
      <input type="date" id="ld" value="${ld||''}">
      <button class="btn" onclick="setLaunchDate()">Schedule milestones</button>
    </div>
    <div id="mileOut">${ld?'<p style="color:#43d17c">✓ Milestones scheduled — see Calendar.</p>':''}</div>
    <div style="margin-top:20px"><button class="btn" onclick="STEP=4;render()">Review & Go Live →</button></div>
  </div>`;
}

async function setLaunchDate(){
  const v = $('#ld').value;
  if (!v) { toast('Pick a date'); return; }
  if (isLive()) { const r = await raw('/api/golive/launch-date', { method:'POST', body: JSON.stringify({ launchDate: v }) }); $('#mileOut').innerHTML = `<p style="color:#43d17c">✓ ${r.sync.events} milestone(s) + ${r.sync.reminders} reminder(s) scheduled.</p>`; }
  else { (OS.demoGoLive = OS.demoGoLive || {}).launchDate = v; OS.persistDemo(); $('#mileOut').innerHTML = '<p style="color:#43d17c">✓ Scheduled (demo).</p>'; }
  toast('Launch timeline set');
}

function stepGo(){
  const p = DATA.progress || {pct:0};
  const live = DATA.status && DATA.status.status === 'live';
  $('#view').innerHTML = `
  <div class="gl-hero" style="text-align:center">
    <h2>${live ? '🚀 Lines & Logos is LIVE' : 'Final check before launch'}</h2>
    <div class="gl-bar" style="max-width:420px;margin:18px auto"><i style="width:${p.pct}%"></i></div>
    <p style="color:var(--mut)">Checklist ${p.pct}% complete${DATA.launchDate?` · launching <b>${DATA.launchDate}</b>`:''}</p>
    ${!live ? `<p style="color:var(--mut);font-size:13px;max-width:480px;margin:0 auto 18px">Going live keeps all agents on duty (security, self-heal, improvement, logistics) and locks this wizard. You can still edit content anytime.</p>
    <button class="big-go" style="max-width:420px" onclick="doGoLive()">🚀 GO LIVE</button>` : `<p style="color:#43d17c;font-weight:700">Launched ${ago(DATA.status.liveAt)} — good luck out there.</p>`}
    <div style="margin-top:18px"><button class="btn btn-ghost" onclick="STEP=3;render()">Back</button></div>
  </div>`;
}

async function doGoLive(){
  if (!confirm('Go live now? The app is ready when you are.')) return;
  if (isLive()) { await raw('/api/golive/go', { method:'POST' }); }
  else { (OS.demoGoLive = OS.demoGoLive || {}).status = 'live'; OS.demoGoLive.liveAt = new Date().toISOString(); OS.persistDemo(); }
  toast('🚀 You are LIVE!'); STEP=4; load();
}

boot('golive', 'Go Live', async () => { await load(); });
</script>
</body>
</html>
