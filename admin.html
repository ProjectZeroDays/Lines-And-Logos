<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agents &amp; Admin — Lines &amp; Logos Business OS</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/os.css?v=9">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lines & Logos">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body data-perms="notifications">
<main>
  <div class="topbar">
    <div><div class="crumb">Business OS / Agents &amp; Admin</div><h1 class="chrome">Agents &amp; Admin</h1></div>
    <div class="topbar-right">
      <input class="search" id="q" placeholder="Search…" oninput="render()">
    </div>
  </div>
  <div class="tabs2" id="tabs"></div>
  <div id="view"></div>
</main>
<script src="assets/os.js?v=9"></script>
<script>
const {fmt,ago,esc,GEN}=OS;
let view='agents';
const TABS=[['agents','AI Agents'],['customers','Customers · CRM'],['employees','Employees'],['field','Field Map'],['payroll','Payroll'],['hiring','Hiring'],['affiliates','Affiliates'],['approvals','Approvals'],['integrations','Integrations'],['support','Support'],['wiki','Wiki & SOPs'],['policies','Policies'],['notifications','Notifications'],['governance','Governance'],['memory','Memory'],['claw','Kimi Claw'],['settings','Settings']];
function renderTabs(){const pend=OS.cur('approvals').filter(a=>a.status==='pending').length;const openFu=(OS.cur('followUps')||[]).filter(f=>f.status==='open').length;
  OS.$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${view===k?'active':''}" onclick="go('${k}')">${l}${k==='approvals'&&pend?`<span class="cnt">${pend}</span>`:''}${k==='customers'&&openFu?`<span class="cnt">${openFu}</span>`:''}</button>`).join('');}
function go(v){view=v;renderTabs();render();}
const q=()=>OS.$('#q').value.toLowerCase();
const match=(...xs)=>xs.join(' ').toLowerCase().includes(q());

async function render(){
  await ({agents:vAgents,customers:vCustomers,employees:vEmployees,field:vField,payroll:vPayroll,hiring:vHiring,affiliates:vAffiliates,approvals:vApprovals,integrations:vIntegrations,support:vSupport,wiki:vWiki,policies:vPolicies,notifications:vNotifs,governance:vGovernance,memory:vMemory,claw:vClaw,settings:vSettings})[view]();
  renderTabs();
}

/* ---------- AGENTS CONSOLE ---------- */
const AGENTS=[
  {key:'prospect-scout',name:'Prospect Scout Agent',desc:'Finds decision-makers at facilities in our territory, verifies POC / email / phone / website / business name, adds them to the pipeline, and drafts intro emails for your approval.',auto:true,icon:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M11 8v3l2 2"/>'},
  {key:'lead-score',name:'Lead Score Agent',desc:'Scores every new lead 0–100 and tiers it hot/warm/cold. Runs automatically on lead intake.',auto:true,icon:'<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>'},
  {key:'dispatch',name:'Job Dispatch Agent',desc:'Matches open jobs to contractors by skill keywords, rating, and current workload.',icon:'<path d="M14 6l-8.5 8.5a2.1 2.1 0 003 3L17 9"/><path d="M15 5l4 4"/>'},
  {key:'reminder',name:'Invoice Reminder Agent',desc:'Drafts dunning emails with escalating tone — friendly ≤7 days, firm 8–14, final 15+.',icon:'<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6"/>'},
  {key:'health',name:'Health Score Agent',desc:'Grades every account green/yellow/red from overdue invoices, renewal proximity, tickets, and feedback.',icon:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/>'},
  {key:'watch',name:'Competitor Watch Agent',desc:'Scans competitor moves and pricing; flags anything needing action this week.',icon:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/>'},
  {key:'daily-ops',name:'Daily Ops Agent',desc:'Morning brief: today\'s jobs, open quotes, overdue invoices, hot leads, approvals. Runs 07:00 via cron.',auto:true,icon:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>'},
  {key:'status-email',name:'Job Status Update Agent',desc:'Drafts customer progress emails from live job state.',icon:'<path d="M3 8l9 6 9-6"/><rect x="3" y="5" width="18" height="14" rx="2"/>'},
  {key:'repurpose',name:'Content Repurposing Agent',desc:'Turns one blog or case study into LinkedIn, Instagram, Facebook, and X posts.',icon:'<path d="M3 11l18-7-7 18-2.5-7.5z"/>'},
  {key:'competitor',name:'Competitor Analysis Agent',desc:'Deep-dive on one competitor: profile, impact on pipeline, counter-moves.',icon:'<path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>'},
  {key:'crm',name:'CRM Manager Agent',desc:'Sweeps accounts: sends post-job surveys, issues tax-correct invoices on completion, queues stale-touch and renewal follow-ups.',auto:true,icon:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M17 8l2 2 4-4"/>'},
  {key:'finance-watchdog',name:'Financial Watchdog Agent',desc:'Scans Stripe-side payments, expenses, and contractor payouts for odd behavior — spikes, duplicates, stalls — and raises alerts.',auto:true,icon:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M12 8v5M12 16.5v.5"/>'},
  {key:'pricing',name:'Pricing & Tax Agent',desc:'Builds line-item quotes with the estimated combined state + local sales tax for the job city; QuickBooks is the source of truth once connected.',auto:true,icon:'<path d="M13 2L4 14h6l-1 8 9-12h-6z"/><path d="M17 9h4M19 7v4"/>'},
  {key:'hiring',name:'Hiring & Onboarding Agent',desc:'Sends new-hire e-sign packets (W-4, I-9, W-9, state forms), stores signed paperwork, auto-schedules the video interview.',auto:true,icon:'<circle cx="9" cy="7" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 3.5l5 5M21 3.5l-5 5"/>'},
  {key:'procurement',name:'Procurement Agent',desc:'Sources best price + ship date across vendors, drafts POs to Approvals, orders on approval, tracks delivery to restock.',auto:true,icon:'<path d="M3 7h13v10H3z"/><path d="M16 10h3l2 3v4h-5"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/>'},
];
async function vAgents(){
  OS.$('#view').innerHTML=`
  <div class="banner info" style="display:block">${AGENTS.length} autonomous agents run the busywork — heuristic core, LLM-upgradeable (OpenAI/Anthropic keys). Every run is logged to the activity trail. <b>${OS.isLive()?'Live mode':'Demo mode'}</b>.</div>
  <div class="agents-grid">
    ${AGENTS.map(a=>`
    <div class="agent-card">
      <div class="ah"><div class="orb2"><svg viewBox="0 0 24 24">${a.icon}</svg></div><b>${a.name}</b></div>
      <p>${a.desc}</p>
      ${a.auto?'<span class="auto">● runs automatically</span>':''}
      <button class="btn btn-sm" onclick="runAgentNow('${a.key}')">▶ Run Agent</button>
    </div>`).join('')}
    <div class="agent-out" id="agentOut"></div>
  </div>`;
}
async function runAgentNow(key){
  const out=OS.$('#agentOut');out.classList.add('open');
  out.innerHTML='<h4>Running…</h4>';
  const agent=AGENTS.find(a=>a.key===key);
  const r=await OS.runAgent(key,{});
  out.innerHTML=`<h4>${agent.name} — ran ${ago(r.ranAt)} · logged to activity trail</h4>${renderResult(key,r.result)}`;
  out.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderResult(key,res){
  if(key==='prospect-scout') return `<div class="kpis" style="margin-bottom:16px">
    <div class="kpi" style="--accent:var(--blue-hi)"><div class="lbl">Reviewed</div><div class="val">${res.reviewed??0}</div></div>
    <div class="kpi" style="--accent:var(--cyan)"><div class="lbl">Verified</div><div class="val">${res.verified??0}</div></div>
    <div class="kpi" style="--accent:var(--lime)"><div class="lbl">Added to pipeline</div><div class="val">${res.addedToPipeline??0}</div></div>
    <div class="kpi" style="--accent:var(--yellow)"><div class="lbl">Intro emails queued</div><div class="val">${res.emailsQueued??0}</div><div class="delta">approve in Approvals tab</div></div></div>
    ${(res.added||[]).length?`<div class="table-wrap"><table><tr><th>Business</th><th>Score</th><th>Tier</th><th>Verification</th></tr>${res.added.map(a=>`<tr><td><b>${esc(a.business)}</b></td><td>${a.score}</td><td><span class="tag ${GEN(a.tier)}">${esc(a.tier)}</span></td><td>${a.confidence??'—'}% checks passed</td></tr>`).join('')}</table></div>`:'<p style="color:var(--text-dim);font-size:13px">Prospect pool is empty for today — the nightly cron refills and rescans automatically.</p>'}
    <p style="color:var(--text-dim);font-size:12px;margin-top:10px">Every email is a CAN-SPAM-compliant intro (physical address + opt-out) and waits for your approval before sending.</p>`;
  if(key==='dispatch'||key==='lead-score'||key==='reminder'||key==='status-email') return `<pre>${esc(JSON.stringify(res,null,2))}</pre>`;
  if(key==='repurpose') return `<p style="font-size:13px;color:var(--text-dim);margin-bottom:12px">Source: <b style="color:#fff">${esc(res.content)}</b></p>`+res.posts.map(p=>`<div class="post-card"><b>${esc(p.channel)}</b><p>${esc(p.text)}</p></div>`).join('');
  if(key==='health') return `<div class="table-wrap"><table><tr><th>Account</th><th>Health</th><th>Risk notes</th></tr>${res.map(a=>`<tr><td><b>${esc(a.account)}</b></td><td><span class="hdot h-${a.level}">${a.level}</span></td><td>${a.notes.map(esc).join('<br>')}</td></tr>`).join('')}</table></div>`;
  if(key==='watch') return `<div class="table-wrap"><table><tr><th>Competitor</th><th>Threat</th><th>Latest move</th><th>Pricing</th><th>Flag</th></tr>${res.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><span class="tag ${GEN(c.threat)}">${c.threat}</span></td><td>${esc(c.move)} <span class="sub">${c.daysAgo}d ago</span></td><td>${esc(c.pricing)}</td><td><span class="tag ${GEN(c.flag)}">${c.flag}</span></td></tr>`).join('')}</table></div>`;
  if(key==='daily-ops') return `<pre>${esc(JSON.stringify(res,null,2))}</pre>`;
  if(key==='competitor') return `<div class="table-wrap"><table><tr><th>Competitor</th><td><b>${esc(res.profile.name)}</b> — ${esc(res.profile.focus)}</td></tr><tr><th>Impact</th><td>${esc(res.impact)}</td></tr><tr><th>Counter-moves</th><td>${res.counters.map((c,i)=>`${i+1}. ${esc(c)}`).join('<br>')}</td></tr></table></div>`;
  if(key==='crm') return `<div class="kpis" style="margin-bottom:16px">
    <div class="kpi" style="--accent:var(--cyan)"><div class="lbl">Surveys sent</div><div class="val">${res.surveysSent}</div></div>
    <div class="kpi" style="--accent:var(--yellow)"><div class="lbl">Invoices issued</div><div class="val">${res.invoicesSent}</div></div>
    <div class="kpi" style="--accent:var(--lime)"><div class="lbl">Follow-ups queued</div><div class="val">${res.followUpsCreated}</div></div></div>
    ${(res.details||[]).length?`<div class="table-wrap"><table><tr><th>Action</th></tr>${res.details.map(d=>`<tr><td>${esc(d)}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--text-dim);font-size:13px">Nothing due — every completed job has a survey and invoice, and no account is stale or inside the renewal window.</p>'}`;
  if(key==='finance-watchdog') return `<div class="kpis" style="margin-bottom:16px">
    <div class="kpi" style="--accent:var(--red)"><div class="lbl">New alerts</div><div class="val">${res.newAlerts}</div></div>
    <div class="kpi" style="--accent:var(--yellow)"><div class="lbl">Open total</div><div class="val">${res.openTotal}</div></div></div>
    ${(res.alerts||[]).length?`<div class="table-wrap"><table><tr><th>Severity</th><th>Alert</th><th>Detail</th></tr>${res.alerts.map(a=>`<tr><td><span class="tag ${GEN(a.severity)}">${a.severity}</span></td><td><b>${esc(a.title)}</b></td><td>${esc(a.detail)}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--text-dim);font-size:13px">Clean scan — no odd behavior detected in payments, expenses, or payouts.</p>'}`;
  if(key==='pricing') return `<div class="table-wrap"><table>
    <tr><th>Service</th><td><b>${esc(res.service)}</b> — ${res.sqft.toLocaleString()} sq ft · ${res.miles} mi · ${res.crew} crew × ${res.days} day(s)</td></tr>
    ${res.lineItems.map(li=>`<tr><td style="padding-left:28px">${esc(li.label)}</td><td style="text-align:right"><b>${fmt(li.amount)}</b></td></tr>`).join('')}
    <tr><td><b>Pre-tax total</b></td><td style="text-align:right"><b>${fmt(res.total)}</b></td></tr>
    <tr><td><b>Est. ${esc(res.taxStateName)} sales tax (${res.taxRate}%)</b></td><td style="text-align:right"><b>${fmt(res.taxAmount)}</b></td></tr>
    <tr><td><b>Grand total</b></td><td style="text-align:right"><b style="color:#7ad892">${fmt(res.grandTotal)}</b></td></tr>
    <tr><td style="color:var(--text-dim)">Tax source</td><td style="text-align:right"><span class="tag ${res.taxSource==='quickbooks'?'t-green':'t-blue'}">${res.taxSource}</span></td></tr>
  </table></div><p style="font-size:12px;color:var(--text-dim);margin-top:10px">${esc(res.taxDisclaimer||'')}</p>`;
  if(key==='hiring') return `<div class="kpis" style="margin-bottom:16px">
    <div class="kpi" style="--accent:var(--blue-hi)"><div class="lbl">Packets sent</div><div class="val">${res.packetsSent??0}</div></div>
    <div class="kpi" style="--accent:var(--yellow)"><div class="lbl">Awaiting signature</div><div class="val">${res.awaitingSignature??0}</div></div>
    <div class="kpi" style="--accent:var(--cyan)"><div class="lbl">Returned signed</div><div class="val">${res.returned??0}</div></div>
    <div class="kpi" style="--accent:var(--lime)"><div class="lbl">Interviews just scheduled</div><div class="val">${res.interviewsJustScheduled??0}</div></div></div>
    ${(res.interviews||[]).length?`<div class="table-wrap"><table><tr><th>Candidate</th><th>Position</th><th>When</th><th>Status</th></tr>${res.interviews.map(iv=>`<tr><td><b>${esc(iv.name||iv.applicant||'')}</b></td><td>${esc(iv.position||'—')}</td><td>${esc(String(iv.when||'').replace('T',' ').slice(0,16))}</td><td><span class="tag ${GEN(iv.status)}">${esc(iv.status)}</span></td></tr>`).join('')}</table></div>`:'<p style="color:var(--text-dim);font-size:13px">No interviews on the books yet.</p>'}`;
  if(key==='procurement'){ const pos=res.pos||(res.results||[]).flatMap(r=>r.pos||[]);
    const comps=res.comparisons||(res.results||[]).flatMap(r=>r.comparisons||[]);
    return `<div class="kpis" style="margin-bottom:16px">
    <div class="kpi" style="--accent:var(--yellow)"><div class="lbl">POs drafted</div><div class="val">${pos.length}</div></div>
    <div class="kpi" style="--accent:var(--cyan)"><div class="lbl">Vendor offers compared</div><div class="val">${comps.reduce((s,c)=>s+((c.considered||[]).length),0)}</div></div>
    ${res.jobsReviewed!==undefined?`<div class="kpi" style="--accent:var(--blue-hi)"><div class="lbl">Jobs reviewed</div><div class="val">${res.jobsReviewed}</div></div>`:''}</div>
    ${pos.length?`<div class="table-wrap"><table><tr><th>PO</th><th>Vendor</th><th>Items</th><th>Total</th><th>ETA</th></tr>${pos.map(p=>`<tr><td><b>${esc(p.number)}</b></td><td>${esc(p.vendor)}</td><td><span class="sub">${esc((p.items||[]).map(l=>l.name).join(', '))}</span></td><td><b>${fmt(p.total)}</b></td><td>${esc(p.shipEta||'—')}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--text-dim);font-size:13px">Nothing to order — no open material needs, or every need is already covered by an open PO.</p>'}
    <p style="color:var(--text-dim);font-size:12px;margin-top:10px">Drafted POs land in the <b>Approvals</b> queue — nothing is ordered until an admin approves.</p>`; }
  return `<pre>${esc(JSON.stringify(res,null,2))}</pre>`;
}

/* ---------- APPROVALS ---------- */
async function vApprovals(){
  const rows=await OS.list('approvals');
  OS.$('#view').innerHTML=`<div class="panel flush" style="--accent:var(--yellow)"><h3 style="padding:24px 24px 0">Approval Queue</h3><div class="table-wrap"><table>
    <tr><th>Request</th><th>Type</th><th>Amount</th><th>Requested By</th><th>Status</th><th>Actions</th></tr>
    ${rows.filter(a=>match(a.title,a.type,a.requestedBy)).map(a=>`<tr>
      <td><b>${esc(a.title)}</b><span class="sub">requested ${a.created}</span></td>
      <td><span class="tag t-blue">${esc(a.type)}</span></td><td><b>${a.amount?fmt(a.amount):'—'}</b></td>
      <td>${esc(a.requestedBy)}</td><td><span class="tag ${GEN(a.status)}">${a.status}</span></td>
      <td style="white-space:nowrap">${a.status==='pending'?`
        <button class="btn btn-sm btn-green" onclick="decide('${a.id}','approve')">Approve</button>
        <button class="btn btn-sm btn-danger" onclick="decide('${a.id}','reject')">Reject</button>`:'—'}</td>
    </tr>`).join('')||'<tr><td colspan="6" class="empty">Queue is clear</td></tr>'}
  </table></div></div>`;
}
async function decide(id,d){await OS.decideApproval(id,d);OS.toast(`Request ${d==='approve'?'approved':'rejected'}`);render();}

/* ---------- SUPPORT ---------- */
async function vSupport(){
  const [tickets,feedback]=await Promise.all([OS.list('tickets'),OS.list('feedback')]);
  OS.$('#view').innerHTML=`<div class="grid-2 eq">
  <div class="panel flush" style="--accent:var(--orange)"><h3 style="padding:24px 24px 0">Support Tickets <span class="right"><button class="btn btn-sm btn-ghost" onclick="newTicket()">+ New Ticket</button></span></h3><div class="table-wrap"><table>
    <tr><th>Subject</th><th>Account</th><th>Priority</th><th>Status</th><th></th></tr>
    ${tickets.filter(t=>match(t.subject,t.account)).map(t=>`<tr>
      <td><b>${esc(t.subject)}</b><span class="sub">${t.created}</span></td><td>${esc(t.account)}</td>
      <td><span class="tag ${GEN(t.priority)}">${t.priority}</span></td><td><span class="tag ${GEN(t.status)}">${t.status}</span></td>
      <td>${t.status!=='resolved'?`<button class="btn btn-sm btn-green" onclick="resolveTicket('${t.id}')">Resolve</button>`:''}</td>
    </tr>`).join('')}
  </table></div></div>
  <div class="panel flush" style="--accent:var(--lime)"><h3 style="padding:24px 24px 0">Client Feedback</h3><div class="table-wrap"><table>
    <tr><th>Account</th><th>Rating</th><th>Comment</th><th>Date</th></tr>
    ${feedback.map(f=>`<tr><td><b>${esc(f.account)}</b></td><td><b style="color:var(--yellow)">${'★'.repeat(f.rating)}</b></td><td>${esc(f.comment)}</td><td>${f.date}</td></tr>`).join('')}
  </table></div></div>
  </div>`;
}
function newTicket(){
  OS.openModal('New Ticket',`<label>Account</label><select id="f-acct">${OS.cur('accounts').map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select><label>Subject</label><input id="f-subject"><label>Priority</label><select id="f-pri"><option>normal</option><option>high</option><option>low</option></select>`);
  OS.onModalSave(async()=>{await OS.create('tickets',{accountId:OS.field('f-acct'),subject:OS.field('f-subject')||'Support request',priority:OS.field('f-pri'),status:'open',created:OS.today()});OS.closeModal();OS.toast('Ticket opened');render();});
}
async function resolveTicket(id){await OS.patch('tickets',id,{status:'resolved'});OS.toast('Ticket resolved');render();}

/* ---------- WIKI / POLICIES ---------- */
async function vWiki(){
  const rows=await OS.list('wiki');
  OS.$('#view').innerHTML=`<div class="grid-2 eq">${rows.filter(w=>match(w.title,w.category)).map(w=>`
    <div class="panel" style="--accent:var(--cyan)"><h3>${esc(w.title)}</h3>
    <span class="tag t-blue" style="margin-bottom:12px;display:inline-block">${esc(w.category)}</span>
    <p style="font-size:13.5px;line-height:1.8;color:var(--text)">${esc(w.body)}</p></div>`).join('')}</div>`;
}
async function vPolicies(){
  const rows=await OS.list('policies');
  OS.$('#view').innerHTML=`<div class="panel flush" style="--accent:var(--volley)"><h3 style="padding:24px 24px 0">Policy Registry</h3><div class="table-wrap"><table>
    <tr><th>Policy</th><th>Version</th><th>Owner</th><th>Last Updated</th></tr>
    ${rows.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td><span class="tag t-blue">v${p.version}</span></td><td>${esc(p.owner)}</td><td>${p.updated}</td></tr>`).join('')}
  </table></div></div>`;
}

/* ---------- NOTIFICATIONS ---------- */
async function vNotifs(){
  const rows=await OS.list('notifications');
  OS.$('#view').innerHTML=`<div class="panel flush" style="--accent:var(--cyan)"><h3 style="padding:24px 24px 0">Notification Ledger — every outbound email/SMS <span class="right">status: sent | failed</span></h3><div class="table-wrap"><table>
    <tr><th>Sent</th><th>Channel</th><th>To</th><th>Subject</th><th>Preview</th><th>Status</th></tr>
    ${rows.filter(n=>match(n.to,n.subject)).map(n=>`<tr>
      <td>${ago(n.sentAt)}</td><td><span class="tag t-blue">${n.channel}</span></td><td>${esc(n.to)}</td>
      <td><b>${esc(n.subject)}</b></td><td><span class="sub" style="color:var(--text)">${esc(n.preview||'')}</span></td>
      <td><span class="tag ${n.status==='sent'?'t-green':'t-red'}">${n.status}</span></td>
    </tr>`).join('')}

      assignedJob:'MSCS — Gym Refresh (3 gyms)'}));
  }
  const jobs=(await OS.list('jobs')).filter(j=>j.siteLat&&j.siteLng);
  // equirectangular projection around data centroid
  const pts=[...rows.filter(r=>r.last).map(r=>r.last),...jobs.map(j=>({lat:j.siteLat,lng:j.siteLng}))];
  const cLat=pts.length?pts.reduce((s,p)=>s+p.lat,0)/pts.length:35.05, cLng=pts.length?pts.reduce((s,p)=>s+p.lng,0)/pts.length:-89.94;

    ${Array.from({length:6},(_,i)=>`<line x1="0" y1="${i*H/5}" x2="${W}" y2="${i*H/5}" stroke="rgba(120,145,205,.08)"/>`).join('')}
    ${jobs.map(j=>`<rect x="${X(j.siteLng)-5}" y="${Y(j.siteLat)-5}" width="10" height="10" fill="none" stroke="#57c7ff" stroke-width="1.6" transform="rotate(45 ${X(j.siteLng)} ${Y(j.siteLat)})"><title>${esc(j.title)} — ${esc(j.account)}</title></rect>`).join('')}
    ${rows.filter(r=>r.last).map(r=>`<g><circle cx="${X(r.last.lng)}" cy="${Y(r.last.lat)}" r="14" fill="rgba(63,174,90,.15)"/><circle cx="${X(r.last.lng)}" cy="${Y(r.last.lat)}" r="6" fill="${r.clockedIn?'#7ad892':'#7e8cab'}" stroke="#04060d" stroke-width="2"><title>${esc(r.name)} — ${ago(r.last.at)}</title></circle><text x="${X(r.last.lng)+11}" y="${Y(r.last.lat)+4}" fill="#c6d0e6" font-size="11" font-weight="700">${esc(r.name.split(' ')[0])}</text></g>`).join('')}
    <text x="${PAD}" y="${H-14}" fill="#7e8cab" font-size="10.5">◇ job site &nbsp;&nbsp; ● tech (green = clocked in) · work-hours data only · pings retained 90 days</text>
  </svg>`;
  OS.$('#view').innerHTML=`
  <div class="banner info" style="display:block">Live crew positions <b>while clocked in only</b>. Consent is required before any ping is accepted; off-the-clock location is never recorded. ${OS.isLive()?'' :'<b>Demo data</b> — connect the server for live positions.'}</div>
  <div class="kpis">
    <div class="kpi" style="--accent:var(--lime)"><div class="lbl">Clocked in now</div><div class="val">${rows.filter(r=>r.clockedIn).length}</div><div class="delta">of ${rows.length} techs</div></div>
    <div class="kpi" style="--accent:var(--cyan)"><div class="lbl">Consented</div><div class="val">${rows.filter(r=>r.consent).length}</div><div class="delta">signed location consent</div></div>
    <div class="kpi" style="--accent:var(--blue-hi)"><div class="lbl">On-site min today</div><div class="val">${rows.reduce((s,r)=>s+(r.today?.onsiteMin||0),0)}</div><div class="delta">within 150 m of a job site</div></div>
    <div class="kpi" style="--accent:var(--yellow)"><div class="lbl">Pings today</div><div class="val">${rows.reduce((s,r)=>s+(r.today?.pings||0),0)}</div><div class="delta">auto-purged after 90 days</div></div>
  </div>
  <div class="panel flush" style="--accent:var(--cyan)"><h3 style="padding:24px 24px 0">Territory map — Memphis metro</h3><div style="padding:10px 14px 18px">${svg}</div></div>
  <div class="panel flush" style="--accent:var(--blue-hi);margin-top:22px"><h3 style="padding:24px 24px 0">Tech status — work-hours detail</h3><div class="table-wrap"><table>
    <tr><th>Tech</th><th>Consent</th><th>Clock</th><th>Last ping</th><th>Today tracked</th><th>On-site</th><th>Assigned job</th></tr>
    ${rows.map(r=>`<tr>

/* ---------- PAYROLL (admin-visible progress of the whole process) ---------- */
async function vPayroll(){
  let data;
  if(OS.isLive()){ try{ data=await OS.raw('/api/payroll'); }catch(e){ data=null; } }
  if(!data){ // demo fallback
    const emps=await OS.list('employees');const tes=await OS.list('timeEntries');
    const since=OS.addDays(-14);
    const rows=emps.map(e=>{const mine=tes.filter(t=>t.employeeId===e.id&&t.date>=since);
      const hours=mine.reduce((s,t)=>s+t.hours,0);const app=mine.filter(t=>t.approved).reduce((s,t)=>s+t.hours,0);
      const reg=Math.min(hours,40),ot=Math.max(0,hours-40);
      return{employeeId:e.id,employee:e.name,rate:22,hours,approvedHours:app,pendingHours:hours-app,regular:reg,overtime:ot,
        amount:Math.round(reg*22+ot*33),ready:hours===0||app===hours,onsiteTodayMin:55,trackedTodayMin:70};});
    data={summary:{periodStart:since,periodEnd:new Date().toISOString().slice(0,10),settings:{payoutDay:'Friday'},rows,totalReady:rows.filter(r=>r.ready).reduce((s,r)=>s+r.amount,0)},runs:[],payouts:[]};

    <div class="kpi" style="--accent:var(--yellow)"><div class="lbl">Hours awaiting approval</div><div class="val">${pend.reduce((s,r)=>s+r.pendingHours,0)}</div><div class="delta" style="--c:var(--yellow)">${pend.length} techs pending</div></div>
    <div class="kpi" style="--accent:var(--cyan)"><div class="lbl">Payroll runs</div><div class="val">${(data.runs||[]).length}</div><div class="delta">history below</div></div>
  </div>
  <div class="panel flush" style="--accent:var(--lime)"><h3 style="padding:24px 24px 0">This period — per-tech progress
    <span class="right"><button class="btn btn-sm" onclick="payrollRun()">▶ Run Payroll</button></span></h3><div class="table-wrap"><table>
    <tr><th>Tech</th><th>Hours</th><th>Reg / OT</th><th>Rate</th><th>On-site today</th><th>Amount</th><th>Status</th><th></th></tr>
    ${rows.map(r=>`<tr>
      <td><b>${esc(r.employee)}</b></td>
      <td><b>${r.hours}</b>${r.pendingHours?` <span class="sub">(${r.pendingHours} pending)</span>`:''}</td>
      <td>${r.regular} / ${r.overtime}</td><td>${fmt(r.rate)}/h</td>
      <td>${r.onsiteTodayMin||0} min <span class="sub">of ${r.trackedTodayMin||0} tracked</span></td>
      <td><b>${fmt(r.amount)}</b></td>
      <td>${r.ready?'<span class="tag t-green">ready</span>':'<span class="tag t-yellow">needs approval</span>'}</td>
      <td>${r.pendingHours?`<button class="btn btn-sm" onclick="payrollApprove('${r.employeeId}')">Approve ${r.pendingHours}h</button>`:''}</td></tr>`).join('')||'<tr><td colspan="8" class="sub">No time entries this period.</td></tr>'}

async function clawRun(){

  if (r.ok){ OS.toast('Coding job queued'); render(); } else { OS.toast('Queue failed'); }
}

/* ================= GOVERNANCE (Phase 2) ================= */
const authed = () => ({ Authorization: 'Bearer ' + (localStorage.getItem('ll_token') || '') });
async function vGovernance(){
  const [g, audits] = await Promise.all([
    fetch('/api/agent-governance',{headers:authed()}).then(r=>r.json()),
    fetch('/api/agent-audits',{headers:authed()}).then(r=>r.json())
  ]);
  OS.$('#view').innerHTML = `
  <div class="panel" style="--accent:var(--volley)"><h3>Agent Governance <span class="right">Phase 2 — governance before broad autonomy</span></h3>
    <label style="display:flex;gap:10px;align-items:center;font-size:13.5px;margin-bottom:16px;cursor:pointer">
      <input type="checkbox" ${g.masterEnabled?'checked':''} onchange="govMaster(this)" style="width:17px;height:17px;accent-color:var(--blue)">
      <b>Master switch</b> <span style="color:var(--text-dim)">— when off, every agent action across the whole system is blocked (423)</span>
    </label>
    <div class="table-wrap"><table><thead><tr><th>Agent</th><th>Autonomy tier</th><th>Auto-approve cap ($)</th><th>Kill switch</th><th>Scopes</th><th>Note</th><th></th></tr></thead>
    <tbody>${g.agents.map(a=>`<tr>
      <td><b>${esc(a.name)}</b><span class="sub">${a.key}</span></td>
      <td><select class="search" id="gov-tier-${a.key}" style="width:130px;padding:7px 12px">${g.tiers.map(t=>`<option ${a.tier===t?'selected':''}>${t}</option>`).join('')}</select></td>
      <td><input class="search" id="gov-cap-${a.key}" type="number" min="0" value="${a.dollarCap}" style="width:110px;padding:7px 12px"></td>
      <td><input type="checkbox" id="gov-kill-${a.key}" ${a.killSwitch?'checked':''} style="width:17px;height:17px;accent-color:var(--red)"></td>
      <td><input class="search" id="gov-note-${a.key}" value="${esc((a.scopes||[]).join(', '))}" placeholder="e.g. comms, intake" style="width:150px;padding:7px 12px"></td>
      <td><input class="search" id="gov-nt2-${a.key}" value="${esc(a.note||'')}" placeholder="Review notes…" style="width:170px;padding:7px 12px"></td>
      <td><button class="btn sm" onclick="govSave('${a.key}')">Save</button></td>
    </tr>`).join('')}</tbody></table></div>
    <p style="font-size:12px;color:var(--text-dim);margin-top:12px">Tiers: <b>recommend</b> = drafts &amp; proposals only (today's default everywhere) · <b>auto-low</b> = auto-execute $0-risk actions under the cap · <b>auto-mid</b> = adds scheduling within cap · <b>human-gate</b> = always requires a human decision. Money-adjacent agents stay human-gated until Phase 3 hardening.</p>
  </div>
  <div class="grid-2 eq">
    <div class="panel"><h3>Evaluation Harness</h3>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:14px">Runs canned scenarios through the agent brains and scores grounded answers. Run weekly as part of the agent review.</p>
      <button class="btn" onclick="govEval()">Run evaluation</button>
      <div id="gov-eval-out" style="margin-top:14px;font-size:13px;line-height:1.9"></div>
    </div>
    <div class="panel flush"><h3 style="padding:22px 22px 0">Audit Trail <span class="right">last ${audits.length}</span></h3>
      <div class="table-wrap" style="max-height:420px;overflow-y:auto"><table><thead><tr><th>When</th><th>Agent</th><th>Actor</th><th>Status</th></tr></thead>
      <tbody>${audits.slice(0,40).map(a=>`<tr><td style="white-space:nowrap">${new Date(a.at).toLocaleString()}</td><td><b>${a.agent}</b><span class="sub">${a.path}</span></td><td>${a.actor}</td><td><span class="tag ${a.status==='blocked'?'t-red':a.status==='ran'?'t-green':'t-blue'}">${a.status}</span></td></tr>`).join('') || '<tr><td colspan="4" class="empty">No agent actions recorded yet — every /api/agent/* call lands here.</td></tr>'}</tbody></table></div>
    </div>
  </div>`;
}
async function govSave(key){
  await fetch('/api/agent-governance',{method:'POST',headers:{...authed(),'Content-Type':'application/json'},body:JSON.stringify({
    agent:key, tier:document.getElementById('gov-tier-'+key).value, dollarCap:document.getElementById('gov-cap-'+key).value,
    killSwitch:document.getElementById('gov-kill-'+key).checked, scopes:document.getElementById('gov-note-'+key).value, note:document.getElementById('gov-nt2-'+key).value })});
  OS.toast('Governance saved: '+key);
}
async function govMaster(cb){
  await fetch('/api/agent-governance',{method:'POST',headers:{...authed(),'Content-Type':'application/json'},body:JSON.stringify({masterEnabled:cb.checked})});
  OS.toast('Master switch '+(cb.checked?'ON — agents can run':'OFF — all agent actions blocked'));
}
async function govEval(){
  const out=document.getElementById('gov-eval-out');
  out.textContent='Running scenarios…';
  const r=await fetch('/api/agent/eval',{method:'POST',headers:authed()}).then(x=>x.json());
  out.innerHTML=`<div style="font-size:22px;font-weight:800;margin-bottom:10px">${r.score}% <span style="font-size:12px;color:var(--text-dim)">grounded-answer score</span></div>`+
    r.results.map(x=>`<div>${x.pass?'✅':'❌'} ${esc(x.scenario)} <span style="color:var(--text-dim);font-size:11.5px">[${x.brain}${x.miss&&x.miss.length?' · missed: '+x.miss.join(','):''}]</span></div>`).join('');
}

async function loadLocalStatus(){
  const box = document.getElementById('ai-local'); if (!box) return;
  try {
    const r = await fetch('/api/ai/local/status',{headers:authed()}); const d = await r.json();
    box.innerHTML = '<b style="color:var(--text)">Status:</b> ' + (d.running ? '<span style="color:#158a5e;font-weight:700">RUNNING</span> on 127.0.0.1:'+d.port : '<span>stopped</span>')
      + ' · binary: ' + (d.binaryPresent?'✓':'✗') + ' · models: ' + (d.models.length ? d.models.map(esc).join(', ') : 'none')
      + (d.hint ? '<div style="margin-top:8px;color:#a06b00">'+d.hint+'</div>' : '')
      + '<div style="margin-top:10px;display:flex;gap:8px"><button class="btn sm" onclick="aiLocalStart()">Start</button><button class="btn sm ghost" onclick="aiLocalStop()">Stop</button></div>'
      + '<div style="margin-top:10px;font-size:11.5px;line-height:1.6">Hostinger guidance: <b>KVM1 (1 vCPU/4GB)</b> → Qwen2.5-3B-Instruct Q4_K_M or Phi-3.5-mini Q4_K_M (~2–2.5GB RAM, ~2–5 tok/s — fine for background agents). <b>KVM2 (2 vCPU/8GB)</b> → Qwen3-4B-Instruct-2507. Shared hosting cannot run local models — auto-routing falls back to OpenRouter free.</div>';
  } catch(e){ box.innerHTML = 'Local model status unavailable (demo mode).'; }
}
async function aiLocalStart(){ await fetch('/api/ai/local/start',{method:'POST',headers:authed()}); setTimeout(loadLocalStatus, 4000); OS.toast('Local model starting…'); }
async function aiLocalStop(){ await fetch('/api/ai/local/stop',{method:'POST',headers:authed()}); setTimeout(loadLocalStatus, 500); }
async function saveSettings(){
  await OS.saveSettings({companyName:OS.field('s-company'),adminEmail:OS.field('s-admin'),fromEmail:OS.field('s-from'),invoiceTermsDays:+OS.field('s-terms')||30});
  OS.toast('Settings saved');
}
function demoOn(){ return localStorage.getItem('ll_demo')==='1'; }
function toggleDemo(){
  const on=demoOn();
  if(on){
    if(!confirm('Disable demo mode? The normal sign-in gate returns on next load.')) return;
    localStorage.removeItem('ll_demo');
  } else {
    localStorage.setItem('ll_demo','1');
  }
  location.reload();
}
async function runCron(){await OS.cron('daily');OS.toast('Daily cron ran — brief generated, reminders queued');}
OS.boot('admin','Agents & Admin',async()=>{await Promise.all([OS.list('approvals'),OS.list('accounts'),OS.list('notifications'),OS.list('followUps')]);renderTabs();await render();});
</script>
<script src="assets/pwa.js" defer></script>
</body>
</html>
